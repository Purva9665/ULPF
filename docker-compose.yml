version: '3.8'

# ═══════════════════════════════════════════════════════════════════════
# ULPF Enterprise Docker Compose
# Services: ULPF Engine + PostgreSQL (three-database architecture)
#
# Air-gap note: all images must be pre-pulled and cached.
# Run:  docker-compose pull  (on internet-connected machine)
#       docker save ... | docker load  (on air-gapped machine)
# ═══════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL — three-database enterprise storage ──────────────────
  postgres:
    image: postgres:17-alpine
    container_name: ulpf-postgres
    # Only started with:  docker compose --profile enterprise up
    # The default configuration uses SQLite, so postgres must not be able to
    # block the engine from starting.
    profiles: ["enterprise"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ulpf_admin_changeme
      # Create all three databases on first run
      POSTGRES_MULTIPLE_DATABASES: ulpf_raw,ulpf_siem,ulpf_datalake
    volumes:
      - ulpf-pg-data:/var/lib/postgresql/data
      # Init scripts run once on first container start
      - ./scripts/docker-pg-init.sh:/docker-entrypoint-initdb.d/01-create-dbs.sh
      - ./scripts/init_roles.sql:/docker-entrypoint-initdb.d/02-roles.sql
      - ./backend/storage/schema.sql:/docker-entrypoint-initdb.d/03-schema.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ulpf_raw"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ULPF Engine — FastAPI + Pipeline + ML ───────────────────────────
  ulpf-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ulpf-engine
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ULPF_LOG_LEVEL=INFO
      # SQLite (default, air-gap prototype):
      - ULPF_DB_PATH=/data/ulpf_events.db
      # PostgreSQL (enterprise — uncomment to activate):
      # - ULPF_DB_BACKEND=postgres
      # - ULPF_PG_HOST=postgres
      # - ULPF_PG_PORT=5432
      # - ULPF_PG_USER=svc_ulpf
      # - ULPF_PG_PASSWORD=ulpf_proc_changeme
      - ULPF_STATIC_DIR=/app/static
      - ULPF_MODEL_PATH=/app/models/ulpf_fusion.pkl
    volumes:
      - ulpf-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  ulpf-data:
    driver: local
  ulpf-pg-data:
    driver: local

